<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">ATSFlow commands</title>
  <desc id="d">Seven command groups: generate AI content, analyze with 30+ ATS checks, parse PDF and DOCX resumes, tailor a resume to a job, export to five formats, benchmark against an industry, and manage versions. Each works from the CLI or the API server.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes c0 { 0%,4.00% { opacity:0; transform:translateX(-10px); } 8.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c0 { animation:c0 10.0s infinite; }
    @keyframes c1 { 0%,9.00% { opacity:0; transform:translateX(-10px); } 13.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c1 { animation:c1 10.0s infinite; }
    @keyframes c2 { 0%,14.00% { opacity:0; transform:translateX(-10px); } 18.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c2 { animation:c2 10.0s infinite; }
    @keyframes c3 { 0%,19.00% { opacity:0; transform:translateX(-10px); } 23.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c3 { animation:c3 10.0s infinite; }
    @keyframes c4 { 0%,24.00% { opacity:0; transform:translateX(-10px); } 28.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c4 { animation:c4 10.0s infinite; }
    @keyframes c5 { 0%,29.00% { opacity:0; transform:translateX(-10px); } 33.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c5 { animation:c5 10.0s infinite; }
    @keyframes c6 { 0%,34.00% { opacity:0; transform:translateX(-10px); } 38.00%,95% { opacity:1; transform:translateX(0); } 100% { opacity:0; } } .c6 { animation:c6 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="460" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="28" font-weight="800">One tool, seven jobs</text>
  <text x="40" y="80" font-size="15" class="muted">Everything runs from the CLI (<tspan class="mono">node cli.js …</tspan>) or the API server on port 3000.</text>
  <g class="c0">
      <rect x="40" y="128" width="430" height="72" rx="12" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/>
      <text x="58" y="158" font-size="15" font-weight="700" class="mono" style="fill:#b58cff">generate</text>
      <text x="58" y="180" font-size="12.5" class="muted">AI summaries, cover letters, descriptions</text>
    </g><g class="c1">
      <rect x="490" y="128" width="430" height="72" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/>
      <text x="508" y="158" font-size="15" font-weight="700" class="mono" style="fill:#3ddc84">analyze</text>
      <text x="508" y="180" font-size="12.5" class="muted">30+ ATS checks, scored with fixes</text>
    </g><g class="c2">
      <rect x="40" y="210" width="430" height="72" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/>
      <text x="58" y="240" font-size="15" font-weight="700" class="mono" style="fill:#3ec7ff">parse</text>
      <text x="58" y="262" font-size="12.5" class="muted">pull data from PDF / DOCX resumes</text>
    </g><g class="c3">
      <rect x="490" y="210" width="430" height="72" rx="12" fill="#ff5c8a" fill-opacity=".08" stroke="#ff5c8a" stroke-opacity=".55"/>
      <text x="508" y="240" font-size="15" font-weight="700" class="mono" style="fill:#ff5c8a">tailor</text>
      <text x="508" y="262" font-size="12.5" class="muted">rewrite a resume for one job post</text>
    </g><g class="c4">
      <rect x="40" y="292" width="430" height="72" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/>
      <text x="58" y="322" font-size="15" font-weight="700" class="mono" style="fill:#ffb02e">export</text>
      <text x="58" y="344" font-size="12.5" class="muted">PDF · DOCX · TXT · JSON · HTML</text>
    </g><g class="c5">
      <rect x="490" y="292" width="430" height="72" rx="12" fill="#20b8cd" fill-opacity=".08" stroke="#20b8cd" stroke-opacity=".55"/>
      <text x="508" y="322" font-size="15" font-weight="700" class="mono" style="fill:#20b8cd">benchmark</text>
      <text x="508" y="344" font-size="12.5" class="muted">skills-gap vs an industry or role</text>
    </g><g class="c6">
      <rect x="265" y="374" width="430" height="72" rx="12" fill="#f6821f" fill-opacity=".08" stroke="#f6821f" stroke-opacity=".55"/>
      <text x="283" y="404" font-size="15" font-weight="700" class="mono" style="fill:#f6821f">versions</text>
      <text x="283" y="426" font-size="12.5" class="muted">track and diff resume versions</text>
    </g>
</svg>
